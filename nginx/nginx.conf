events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    client_max_body_size 10M;

    # Docker DNS. Use variable proxy_pass targets so nginx re-resolves service
    # names after containers are rebuilt/recreated and receive new internal IPs.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Port 80: Public pool website + pool manager API ───────────────────
    server {
        listen 80;
        server_name _;
        set $pool_manager_upstream pool_manager:8080;

        # Pool Manager REST API
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$pool_manager_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Ops metrics can rebuild slowly; fail before Cloudflare dumps HTML.
            proxy_connect_timeout 3s;
            proxy_send_timeout 20s;
            proxy_read_timeout 20s;
        }

        # Pool website static files
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }

    # ── Port 5115: Public slave API via Cloudflare Tunnel only ─────────────
    # The stock TIG slave constructs plain HTTP URLs from MASTER_IP/MASTER_PORT.
    # Cloudflare Tunnel should route master.innopool.co.uk -> localhost:8081,
    # which lands here and forwards only the slave-safe master endpoints.
    server {
        listen 5115;
        server_name _;
        set $master_slave_upstream master:5115;

        location = /get-batches {
            proxy_pass http://$master_slave_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Slave client timeout is 60s. Default nginx read timeout is also
            # 60s, so a wedged master looks like a dead fleet. Fail fast.
            proxy_connect_timeout 2s;
            proxy_send_timeout 8s;
            proxy_read_timeout 8s;
        }

        location ~ ^/(submit-batch-root|submit-batch-proofs|submit-batch-error)/ {
            proxy_pass http://$master_slave_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_send_timeout 20s;
            proxy_read_timeout 20s;
        }

        location / {
            return 404;
        }
    }

    # ── Port 8888: Benchmarker admin UI (operator only) ───────────────────
    # Served at root so the Angular app's asset paths work correctly.
    # On production: firewall this port — open only to your own IP.
    server {
        listen 8888;
        server_name _;
        set $master_api_upstream master:3336;
        set $bench_ui_upstream benchmarker_ui:80;

        auth_basic "InnoPool Operator";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # Master API endpoints called by the Angular UI
        location ~ ^/(get-config|update-config|get-latest-data|get-jobs|get-batch-data|stop) {
            proxy_pass http://$master_api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Serve Monaco editor locally — avoids cdn.jsdelivr.net @latest redirect loop
        location /monaco-cdn/ {
            alias /usr/share/nginx/monaco/vs/;
            add_header Cache-Control "public, max-age=86400";
        }

        # Angular benchmarker UI — rewrite Monaco CDN URL to our local copy
        location / {
            proxy_pass http://$bench_ui_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # Disable upstream gzip so sub_filter can rewrite content
            proxy_set_header Accept-Encoding "";
            # Rewrite Monaco CDN @latest URL → local /monaco-cdn/
            sub_filter 'https://cdn.jsdelivr.net/npm/monaco-editor@latest/min/vs' '/monaco-cdn';
            sub_filter_once off;
            sub_filter_types application/javascript text/javascript;
        }
    }
}
