events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    client_max_body_size 10M;

    # Define upstreams explicitly — avoids DNS search-domain issues at runtime
    upstream master_api    { server master:3336; }
    upstream pool_manager  { server pool_manager:8080; }
    upstream bench_ui      { server benchmarker_ui:80; }

    # ── Port 80: Public pool website + pool manager API ───────────────────
    server {
        listen 80;
        server_name _;

        # Pool Manager REST API
        location /api/ {
            proxy_pass http://pool_manager/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Pool website static files
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }

    # ── Port 8888: Benchmarker admin UI (operator only) ───────────────────
    # Served at root so the Angular app's asset paths work correctly.
    # On production: firewall this port — open only to your own IP.
    server {
        listen 8888;
        server_name _;

        auth_basic "InnoPool Operator";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # Master API endpoints called by the Angular UI
        location ~ ^/(get-config|update-config|get-latest-data|get-jobs|get-batch-data|stop) {
            proxy_pass http://master_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Serve Monaco editor locally — avoids cdn.jsdelivr.net @latest redirect loop
        location /monaco-cdn/ {
            alias /usr/share/nginx/monaco/vs/;
            add_header Cache-Control "public, max-age=86400";
        }

        # Angular benchmarker UI — rewrite Monaco CDN URL to our local copy
        location / {
            proxy_pass http://bench_ui/;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # Disable upstream gzip so sub_filter can rewrite content
            proxy_set_header Accept-Encoding "";
            # Rewrite Monaco CDN @latest URL → local /monaco-cdn/
            sub_filter 'https://cdn.jsdelivr.net/npm/monaco-editor@latest/min/vs' '/monaco-cdn';
            sub_filter_once off;
            sub_filter_types application/javascript text/javascript;
        }
    }
}
