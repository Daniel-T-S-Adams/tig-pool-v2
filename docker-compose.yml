services:
  db:
    image: postgres:17
    container_name: innopool_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./db_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - innopool
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  master:
    build:
      context: ./master
      args:
        TIG_VERSION: ${TIG_VERSION}
    container_name: innopool_master
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db
      - VERBOSE=${VERBOSE}
      - PRECOMMIT_GOVERNOR_ENABLED=${PRECOMMIT_GOVERNOR_ENABLED:-true}
      - PRECOMMIT_GOVERNOR_MAX_ROOTS_PENDING=${PRECOMMIT_GOVERNOR_MAX_ROOTS_PENDING:-256}
      - PRECOMMIT_GOVERNOR_MIN_ROOT_READY_RATE=${PRECOMMIT_GOVERNOR_MIN_ROOT_READY_RATE:-0.50}
      - PRECOMMIT_GOVERNOR_MIN_SAMPLES=${PRECOMMIT_GOVERNOR_MIN_SAMPLES:-5}
      - PRECOMMIT_GOVERNOR_WINDOW_MS=${PRECOMMIT_GOVERNOR_WINDOW_MS:-1800000}
      - PRECOMMIT_GOVERNOR_CACHE_MS=${PRECOMMIT_GOVERNOR_CACHE_MS:-15000}
      - PRECOMMIT_GOVERNOR_IDLE_CPU_OVERRIDE=${PRECOMMIT_GOVERNOR_IDLE_CPU_OVERRIDE:-true}
    networks:
      - innopool
    ports:
      # Slave API — pool members (and test slaves) point MASTER_IP:MASTER_PORT here
      - "${BIND_ADDR:-0.0.0.0}:${MASTER_PORT}:5115"
      # ClientManager API — exposes /get-config, /update-config etc to localhost
      # so configure_innopool.py can reach it without going through nginx auth
      - "${BIND_ADDR:-0.0.0.0}:3336:3336"
    depends_on:
      db:
        condition: service_healthy

  pool_manager:
    build:
      context: ./pool_manager
    container_name: innopool_manager
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db
      - POOL_FEE=${POOL_FEE}
      - POOL_NAME=${POOL_NAME}
      - POOL_SERVER_IP=${POOL_SERVER_IP}
      - PUBLIC_MASTER_HOST=${PUBLIC_MASTER_HOST:-}
      - PUBLIC_MASTER_PORT=${PUBLIC_MASTER_PORT:-}
      - POOL_PUBLIC_URL=${POOL_PUBLIC_URL:-https://www.innopool.co.uk}
      - MASTER_PORT=${MASTER_PORT}
      - ADMIN_SECRET=${ADMIN_SECRET}
      - MASTER_INTERNAL_URL=http://master:3336
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-false}
      - GPU_MAX_CONCURRENT_BATCHES=${GPU_MAX_CONCURRENT_BATCHES:-1}
      - CPU_MAX_CONCURRENT_BATCHES=${CPU_MAX_CONCURRENT_BATCHES:-512}
      - SCHEDULER_MIN_BENCHMARKS=${SCHEDULER_MIN_BENCHMARKS:-3}
      - SCHEDULER_MAX_BENCHMARKS=${SCHEDULER_MAX_BENCHMARKS:-20}
      - AUTOPILOT_MODE=${AUTOPILOT_MODE:-off}
      - AUTOPILOT_INTERVAL_S=${AUTOPILOT_INTERVAL_S:-300}
      - AUTOPILOT_APPLY_MIN_CLEAN_WINDOWS=${AUTOPILOT_APPLY_MIN_CLEAN_WINDOWS:-2}
      - AUTOPILOT_MAX_MAX_BENCHMARKS=${AUTOPILOT_MAX_MAX_BENCHMARKS:-192}
      - AUTOPILOT_UPSTREAM_SAFE_MAX_BENCHMARKS=${AUTOPILOT_UPSTREAM_SAFE_MAX_BENCHMARKS:-70}
      - AUTOPILOT_MAX_BENCHMARK_STEP=${AUTOPILOT_MAX_BENCHMARK_STEP:-2}
      - AUTOPILOT_MAX_BENCHMARK_UP_STEP=${AUTOPILOT_MAX_BENCHMARK_UP_STEP:-2}
      - AUTOPILOT_MAX_BENCHMARK_DOWN_STEP=${AUTOPILOT_MAX_BENCHMARK_DOWN_STEP:-4}
      - AUTOPILOT_SURGE_TARGET_GAP=${AUTOPILOT_SURGE_TARGET_GAP:-16}
      - AUTOPILOT_SURGE_MAX_BENCHMARK_UP_STEP=${AUTOPILOT_SURGE_MAX_BENCHMARK_UP_STEP:-1}
      - AUTOPILOT_ROOT_PENDING_MAX_CONCURRENT_DRAIN=${AUTOPILOT_ROOT_PENDING_MAX_CONCURRENT_DRAIN:-256}
      - AUTOPILOT_ROOT_READY_RATE_MIN_FOR_UPSCALE=${AUTOPILOT_ROOT_READY_RATE_MIN_FOR_UPSCALE:-0.50}
      - AUTOPILOT_COMPLETION_MATCH_ENABLED=${AUTOPILOT_COMPLETION_MATCH_ENABLED:-true}
      - AUTOPILOT_COMPLETION_MATCH_MIN_SAMPLES=${AUTOPILOT_COMPLETION_MATCH_MIN_SAMPLES:-5}
      - AUTOPILOT_COMPLETION_MATCH_BUFFER=${AUTOPILOT_COMPLETION_MATCH_BUFFER:-8}
      - AUTOPILOT_COMPLETION_INFLIGHT_MULT=${AUTOPILOT_COMPLETION_INFLIGHT_MULT:-2.0}
      - AUTOPILOT_COMPLETION_WARMUP_HEADROOM=${AUTOPILOT_COMPLETION_WARMUP_HEADROOM:-8}
      - AUTOPILOT_SLOT_STEP=${AUTOPILOT_SLOT_STEP:-1}
      - AUTOPILOT_SLOT_UP_STEP=${AUTOPILOT_SLOT_UP_STEP:-3}
      - AUTOPILOT_SLOT_DOWN_STEP=${AUTOPILOT_SLOT_DOWN_STEP:-1}
      - AUTOPILOT_MAX_CPU_SLOTS=${AUTOPILOT_MAX_CPU_SLOTS:-128}
      - AUTOPILOT_MAX_GPU_SLOTS_PER_TYPE=${AUTOPILOT_MAX_GPU_SLOTS_PER_TYPE:-6}
      - AUTOPILOT_MAX_CPU_CHALLENGE_BENCHMARKS=${AUTOPILOT_MAX_CPU_CHALLENGE_BENCHMARKS:-32}
      - AUTOPILOT_MAX_GPU_CHALLENGE_BENCHMARKS=${AUTOPILOT_MAX_GPU_CHALLENGE_BENCHMARKS:-12}
      - AUTOPILOT_MAX_CPU_SLAVE_CAP=${AUTOPILOT_MAX_CPU_SLAVE_CAP:-256}
      - AUTOPILOT_MAX_GPU_SLAVE_CAP=${AUTOPILOT_MAX_GPU_SLAVE_CAP:-24}
      - AUTOPILOT_MIN_CPU_SLAVE_CAP=${AUTOPILOT_MIN_CPU_SLAVE_CAP:-4}
      - AUTOPILOT_MIN_GPU_SLAVE_CAP=${AUTOPILOT_MIN_GPU_SLAVE_CAP:-1}
      - AUTOPILOT_BENCHMARK_BUFFER=${AUTOPILOT_BENCHMARK_BUFFER:-2}
      - AUTOPILOT_PRODUCTIVE_IDLE_CPU_SCALE_MIN=${AUTOPILOT_PRODUCTIVE_IDLE_CPU_SCALE_MIN:-5}
      - AUTOPILOT_PRODUCTIVE_IDLE_CPU_PER_SLOT=${AUTOPILOT_PRODUCTIVE_IDLE_CPU_PER_SLOT:-4}
      - AUTOPILOT_PRODUCTIVE_IDLE_STALE_ROOT_TOLERANCE=${AUTOPILOT_PRODUCTIVE_IDLE_STALE_ROOT_TOLERANCE:-5}
      - AUTOPILOT_PRODUCTIVE_IDLE_GPU_SCALE_MIN=${AUTOPILOT_PRODUCTIVE_IDLE_GPU_SCALE_MIN:-1}
      - AUTOPILOT_PRODUCTIVE_IDLE_GPU_PER_SLOT=${AUTOPILOT_PRODUCTIVE_IDLE_GPU_PER_SLOT:-1}
      - AUTOPILOT_CAP_SCALE_COMPLETIONS_PER_STEP=${AUTOPILOT_CAP_SCALE_COMPLETIONS_PER_STEP:-20}
      - AUTOPILOT_BUNDLE_TARGET_MIN_ROOT_BATCHES=${AUTOPILOT_BUNDLE_TARGET_MIN_ROOT_BATCHES:-8}
      - AUTOPILOT_BUNDLE_TARGET_MAX_ROOT_BATCHES=${AUTOPILOT_BUNDLE_TARGET_MAX_ROOT_BATCHES:-192}
      - AUTOPILOT_BUNDLE_TARGET_ROOT_RUNTIME_SEC=${AUTOPILOT_BUNDLE_TARGET_ROOT_RUNTIME_SEC:-900}
      - AUTOPILOT_FUNNEL_TARGET_PROOF_SUBMIT_SEC=${AUTOPILOT_FUNNEL_TARGET_PROOF_SUBMIT_SEC:-1200}
      - AUTOPILOT_FUNNEL_MIN_PROOF_CONVERSION_RATE=${AUTOPILOT_FUNNEL_MIN_PROOF_CONVERSION_RATE:-0.85}
      - AUTOPILOT_FUNNEL_MAX_STOPPED_OR_EXPIRED_RATE=${AUTOPILOT_FUNNEL_MAX_STOPPED_OR_EXPIRED_RATE:-0.10}
      - AUTOPILOT_WORKLOAD_MIN_BUNDLES=${AUTOPILOT_WORKLOAD_MIN_BUNDLES:-4}
      - AUTOPILOT_WORKLOAD_MIN_BATCH_SIZE=${AUTOPILOT_WORKLOAD_MIN_BATCH_SIZE:-8}
      - AUTOPILOT_AWS_CPU_WORKER_TARGET=${AUTOPILOT_AWS_CPU_WORKER_TARGET:-32}
      - AUTOPILOT_WORKLOAD_MAX_BUNDLE_STEP=${AUTOPILOT_WORKLOAD_MAX_BUNDLE_STEP:-1}
      - AUTOPILOT_WORKLOAD_SAFETY_COOLDOWN_MS=${AUTOPILOT_WORKLOAD_SAFETY_COOLDOWN_MS:-300000}
      - AUTOPILOT_WORKLOAD_FAST_PROOF_FACTOR=${AUTOPILOT_WORKLOAD_FAST_PROOF_FACTOR:-0.50}
      - AUTOPILOT_WORKLOAD_HIGH_PROOF_CONVERSION_RATE=${AUTOPILOT_WORKLOAD_HIGH_PROOF_CONVERSION_RATE:-0.95}
      - AUTOPILOT_ROOT_BACKLOG_DRAIN_MIN_NOT_STARTED=${AUTOPILOT_ROOT_BACKLOG_DRAIN_MIN_NOT_STARTED:-64}
      - AUTOPILOT_ROOT_BACKLOG_DRAIN_MIN_AGE_MS=${AUTOPILOT_ROOT_BACKLOG_DRAIN_MIN_AGE_MS:-900000}
      - AUTOPILOT_STRANDED_BENCHMARK_MS=${AUTOPILOT_STRANDED_BENCHMARK_MS:-1800000}
      - AUTOPILOT_STRANDED_DOWNSCALE_STEP=${AUTOPILOT_STRANDED_DOWNSCALE_STEP:-2}
      - AUTOPILOT_STRANDED_BUFFER_BENCHMARKS=${AUTOPILOT_STRANDED_BUFFER_BENCHMARKS:-2}
      - AUTOPILOT_STALE_CLEANUP_ENABLED=${AUTOPILOT_STALE_CLEANUP_ENABLED:-false}
      - AUTOPILOT_STALE_CLEANUP_MIN_AGE_MS=${AUTOPILOT_STALE_CLEANUP_MIN_AGE_MS:-3600000}
      - AUTOPILOT_STALE_ROOT_CLEANUP_MIN_AGE_MS=${AUTOPILOT_STALE_ROOT_CLEANUP_MIN_AGE_MS:-3600000}
      - AUTOPILOT_STALE_PROOF_CLEANUP_MIN_AGE_MS=${AUTOPILOT_STALE_PROOF_CLEANUP_MIN_AGE_MS:-1200000}
      - AUTOPILOT_STALE_CLEANUP_MAX_ROWS=${AUTOPILOT_STALE_CLEANUP_MAX_ROWS:-50}
      - AUTOPILOT_PRECOMMIT_EXPIRY_CLEANUP_ENABLED=${AUTOPILOT_PRECOMMIT_EXPIRY_CLEANUP_ENABLED:-true}
      # Protocol precommits last ~2h. Keep reclaim/abandon/max-age BELOW that
      # (defaults: ~110m / ~90m / ~115m / ~115m) so late AWS posts don't hit 408s.
      - AUTOPILOT_PRECOMMIT_ROOT_RECLAIM_AGE_MS=${AUTOPILOT_PRECOMMIT_ROOT_RECLAIM_AGE_MS:-6600000}
      - AUTOPILOT_PRECOMMIT_PROOF_RECLAIM_AGE_MS=${AUTOPILOT_PRECOMMIT_PROOF_RECLAIM_AGE_MS:-5400000}
      - AUTOPILOT_PRECOMMIT_ABANDON_NO_ROOT_AGE_MS=${AUTOPILOT_PRECOMMIT_ABANDON_NO_ROOT_AGE_MS:-6900000}
      - AUTOPILOT_BENCHMARK_MAX_AGE_MS=${AUTOPILOT_BENCHMARK_MAX_AGE_MS:-6900000}
      - AUTOPILOT_BENCHMARK_MAX_AGE_CLEANUP_ENABLED=${AUTOPILOT_BENCHMARK_MAX_AGE_CLEANUP_ENABLED:-true}
      - AUTOPILOT_ZOMBIE_PENDING_CLEANUP_ENABLED=${AUTOPILOT_ZOMBIE_PENDING_CLEANUP_ENABLED:-true}
      - AUTOPILOT_ZOMBIE_PENDING_CLEANUP_MAX_ROWS=${AUTOPILOT_ZOMBIE_PENDING_CLEANUP_MAX_ROWS:-5000}
      - AI_OPTIMIZER_ENABLED=${AI_OPTIMIZER_ENABLED:-false}
      - AI_OPTIMIZER_MODE=${AI_OPTIMIZER_MODE:-off}
      - AI_OPTIMIZER_INTERVAL_S=${AI_OPTIMIZER_INTERVAL_S:-600}
      - AI_OPTIMIZER_MAX_TOKENS=${AI_OPTIMIZER_MAX_TOKENS:-4000}
      - AI_CONTEXT_PATH=${AI_CONTEXT_PATH:-/app/docs/ai_pool_operator_context.md}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - DEEPSEEK_API_URL=${DEEPSEEK_API_URL:-https://api.deepseek.com/chat/completions}
    volumes:
      - ./docs:/app/docs:ro
    networks:
      - innopool
    expose:
      - 8080
    depends_on:
      db:
        condition: service_healthy
      master:
        condition: service_started

  benchmarker_ui:
    image: ghcr.io/tig-foundation/tig-monorepo/benchmarker/ui:${TIG_VERSION}
    container_name: innopool_benchmarker_ui
    restart: unless-stopped
    networks:
      - innopool
    ports:
      - "${BIND_ADDR:-0.0.0.0}:7777:80"
    expose:
      - 80
    depends_on:
      - master

  nginx:
    build:
      context: .         # root context so Dockerfile can access pool_website/
      dockerfile: nginx/Dockerfile
    container_name: innopool_nginx
    restart: unless-stopped
    environment:
      - OPERATOR_USER=${OPERATOR_USER}
      - OPERATOR_PASSWORD=${OPERATOR_PASSWORD}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${WEB_PORT}:80"
      - "${BIND_ADDR:-0.0.0.0}:${OPERATOR_PORT}:8888"
      # Master slave API through nginx, for Cloudflare Tunnel hostname routing.
      - "${BIND_ADDR:-0.0.0.0}:${MASTER_TUNNEL_PORT:-8081}:5115"
    networks:
      - innopool
    depends_on:
      - benchmarker_ui
      - master
      - pool_manager

networks:
  innopool:
