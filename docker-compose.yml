services:
  db:
    image: postgres:17
    container_name: innopool_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./db_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - innopool
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  master:
    build:
      context: ./master
      args:
        TIG_VERSION: ${TIG_VERSION}
    container_name: innopool_master
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db
      - VERBOSE=${VERBOSE}
      - PRECOMMIT_GOVERNOR_ENABLED=${PRECOMMIT_GOVERNOR_ENABLED:-true}
      - PRECOMMIT_GOVERNOR_MAX_ROOTS_PENDING=${PRECOMMIT_GOVERNOR_MAX_ROOTS_PENDING:-1024}
