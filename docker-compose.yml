services:
  db:
    image: postgres:17
    container_name: innopool_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./db_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - innopool
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  master:
    image: ghcr.io/tig-foundation/tig-monorepo/benchmarker/master:${TIG_VERSION}
    container_name: innopool_master
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db
      - VERBOSE=${VERBOSE}
    networks:
      - innopool
    ports:
      # Slave API — pool members (and test slaves) point MASTER_IP:MASTER_PORT here
      - "${MASTER_PORT}:5115"
      # ClientManager API — exposes /get-config, /update-config etc to localhost
      # so configure_innopool.py can reach it without going through nginx auth
      - "3336:3336"
    depends_on:
      db:
        condition: service_healthy

  pool_manager:
    build:
      context: ./pool_manager
    container_name: innopool_manager
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db
      - POOL_FEE=${POOL_FEE}
      - POOL_NAME=${POOL_NAME}
      - POOL_SERVER_IP=${POOL_SERVER_IP}
      - MASTER_PORT=${MASTER_PORT}
      - ADMIN_SECRET=${ADMIN_SECRET}
      - MASTER_INTERNAL_URL=http://master:3336
    networks:
      - innopool
    expose:
      - 8080
    depends_on:
      db:
        condition: service_healthy
      master:
        condition: service_started

  benchmarker_ui:
    image: ghcr.io/tig-foundation/tig-monorepo/benchmarker/ui:${TIG_VERSION}
    container_name: innopool_benchmarker_ui
    restart: unless-stopped
    networks:
      - innopool
    ports:
      - "7777:80"
    expose:
      - 80
    depends_on:
      - master

  nginx:
    build:
      context: .         # root context so Dockerfile can access pool_website/
      dockerfile: nginx/Dockerfile
      args:
        OPERATOR_USER: ${OPERATOR_USER}
        OPERATOR_PASSWORD: ${OPERATOR_PASSWORD}
    container_name: innopool_nginx
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:80"
      - "${OPERATOR_PORT}:8888"
    networks:
      - innopool
    depends_on:
      - benchmarker_ui
      - master
      - pool_manager

networks:
  innopool:
