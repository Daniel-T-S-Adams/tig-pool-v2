services:
  db:
    image: postgres:17
    container_name: innopool_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./db_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - innopool
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  master:
    build:
      context: ./master
      args:
        TIG_VERSION: ${TIG_VERSION}
    container_name: innopool_master
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db
      - VERBOSE=${VERBOSE}
    networks:
      - innopool
    ports:
      # Slave API — pool members (and test slaves) point MASTER_IP:MASTER_PORT here
      - "${BIND_ADDR:-0.0.0.0}:${MASTER_PORT}:5115"
      # ClientManager API — exposes /get-config, /update-config etc to localhost
      # so configure_innopool.py can reach it without going through nginx auth
      - "${BIND_ADDR:-0.0.0.0}:3336:3336"
    depends_on:
      db:
        condition: service_healthy

  pool_manager:
    build:
      context: ./pool_manager
    container_name: innopool_manager
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db
      - POOL_FEE=${POOL_FEE}
      - POOL_NAME=${POOL_NAME}
      - POOL_SERVER_IP=${POOL_SERVER_IP}
      - PUBLIC_MASTER_HOST=${PUBLIC_MASTER_HOST:-}
      - PUBLIC_MASTER_PORT=${PUBLIC_MASTER_PORT:-}
      - POOL_PUBLIC_URL=${POOL_PUBLIC_URL:-https://www.innopool.co.uk}
      - MASTER_PORT=${MASTER_PORT}
      - ADMIN_SECRET=${ADMIN_SECRET}
      - MASTER_INTERNAL_URL=http://master:3336
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-false}
      - GPU_MAX_CONCURRENT_BATCHES=${GPU_MAX_CONCURRENT_BATCHES:-1}
      - CPU_MAX_CONCURRENT_BATCHES=${CPU_MAX_CONCURRENT_BATCHES:-10}
      - SCHEDULER_MIN_BENCHMARKS=${SCHEDULER_MIN_BENCHMARKS:-3}
      - SCHEDULER_MAX_BENCHMARKS=${SCHEDULER_MAX_BENCHMARKS:-20}
      - AUTOPILOT_MODE=${AUTOPILOT_MODE:-off}
      - AUTOPILOT_INTERVAL_S=${AUTOPILOT_INTERVAL_S:-300}
      - AUTOPILOT_APPLY_MIN_CLEAN_WINDOWS=${AUTOPILOT_APPLY_MIN_CLEAN_WINDOWS:-2}
      - AUTOPILOT_MAX_MAX_BENCHMARKS=${AUTOPILOT_MAX_MAX_BENCHMARKS:-96}
      - AUTOPILOT_MAX_BENCHMARK_STEP=${AUTOPILOT_MAX_BENCHMARK_STEP:-2}
      - AUTOPILOT_SLOT_STEP=${AUTOPILOT_SLOT_STEP:-1}
      - AUTOPILOT_MAX_CPU_SLOTS=${AUTOPILOT_MAX_CPU_SLOTS:-64}
      - AUTOPILOT_MAX_GPU_SLOTS_PER_TYPE=${AUTOPILOT_MAX_GPU_SLOTS_PER_TYPE:-6}
      - AUTOPILOT_PRODUCTIVE_IDLE_CPU_SCALE_MIN=${AUTOPILOT_PRODUCTIVE_IDLE_CPU_SCALE_MIN:-5}
      - AUTOPILOT_PRODUCTIVE_IDLE_CPU_PER_SLOT=${AUTOPILOT_PRODUCTIVE_IDLE_CPU_PER_SLOT:-4}
      - AUTOPILOT_STRANDED_BENCHMARK_MS=${AUTOPILOT_STRANDED_BENCHMARK_MS:-1800000}
      - AUTOPILOT_STRANDED_DOWNSCALE_STEP=${AUTOPILOT_STRANDED_DOWNSCALE_STEP:-2}
      - AUTOPILOT_STRANDED_BUFFER_BENCHMARKS=${AUTOPILOT_STRANDED_BUFFER_BENCHMARKS:-2}
      - AUTOPILOT_STALE_CLEANUP_ENABLED=${AUTOPILOT_STALE_CLEANUP_ENABLED:-false}
      - AUTOPILOT_STALE_CLEANUP_MIN_AGE_MS=${AUTOPILOT_STALE_CLEANUP_MIN_AGE_MS:-3600000}
      - AUTOPILOT_STALE_ROOT_CLEANUP_MIN_AGE_MS=${AUTOPILOT_STALE_ROOT_CLEANUP_MIN_AGE_MS:-3600000}
      - AUTOPILOT_STALE_PROOF_CLEANUP_MIN_AGE_MS=${AUTOPILOT_STALE_PROOF_CLEANUP_MIN_AGE_MS:-1200000}
      - AUTOPILOT_STALE_CLEANUP_MAX_ROWS=${AUTOPILOT_STALE_CLEANUP_MAX_ROWS:-50}
      - AI_OPTIMIZER_MODE=${AI_OPTIMIZER_MODE:-off}
      - AI_OPTIMIZER_INTERVAL_S=${AI_OPTIMIZER_INTERVAL_S:-600}
      - AI_CONTEXT_PATH=${AI_CONTEXT_PATH:-/app/docs/ai_pool_operator_context.md}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - DEEPSEEK_API_URL=${DEEPSEEK_API_URL:-https://api.deepseek.com/chat/completions}
    volumes:
      - ./docs:/app/docs:ro
    networks:
      - innopool
    expose:
      - 8080
    depends_on:
      db:
        condition: service_healthy
      master:
        condition: service_started

  benchmarker_ui:
    image: ghcr.io/tig-foundation/tig-monorepo/benchmarker/ui:${TIG_VERSION}
    container_name: innopool_benchmarker_ui
    restart: unless-stopped
    networks:
      - innopool
    ports:
      - "${BIND_ADDR:-0.0.0.0}:7777:80"
    expose:
      - 80
    depends_on:
      - master

  nginx:
    build:
      context: .         # root context so Dockerfile can access pool_website/
      dockerfile: nginx/Dockerfile
    container_name: innopool_nginx
    restart: unless-stopped
    environment:
      - OPERATOR_USER=${OPERATOR_USER}
      - OPERATOR_PASSWORD=${OPERATOR_PASSWORD}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${WEB_PORT}:80"
      - "${BIND_ADDR:-0.0.0.0}:${OPERATOR_PORT}:8888"
      # Master slave API through nginx, for Cloudflare Tunnel hostname routing.
      - "${BIND_ADDR:-0.0.0.0}:${MASTER_TUNNEL_PORT:-8081}:5115"
    networks:
      - innopool
    depends_on:
      - benchmarker_ui
      - master
      - pool_manager

networks:
  innopool:
